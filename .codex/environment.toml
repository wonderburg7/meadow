version = 1
name = "Meadow"

[setup]
script = "powershell -NoProfile -ExecutionPolicy Bypass -File tools/verify.ps1"

[setup.win32]
script = """
$primary = (Resolve-Path (Join-Path (git rev-parse --git-common-dir).Trim() '..')).Path
$worktrees = Join-Path $primary '.worktrees'
$safeDirectories = @($primary, ($worktrees + '/*')) | ForEach-Object { $_.Replace('\\', '/') }
$configured = @(git config --global --get-all safe.directory)
foreach ($directory in $safeDirectories) {
    if ($configured -notcontains $directory) {
        git config --global --add safe.directory $directory
    }
}
powershell -NoProfile -ExecutionPolicy Bypass -File tools/verify.ps1
"""

[[actions]]
name = "Verify"
icon = "test"
command = "powershell -NoProfile -ExecutionPolicy Bypass -File tools/verify.ps1"
platform = "win32"

[[actions]]
name = "Check slice readiness"
icon = "test"
command = "powershell -NoProfile -ExecutionPolicy Bypass -File tools/slice.ps1 doctor -Lane Codex"
platform = "win32"

[[actions]]
name = "Claim Codex slice"
icon = "play"
command = "powershell -NoProfile -ExecutionPolicy Bypass -File tools/slice.ps1 start -Lane Codex"
platform = "win32"

[[actions]]
name = "Finish slice"
icon = "check"
command = "powershell -NoProfile -ExecutionPolicy Bypass -File tools/slice.ps1 finish"
platform = "win32"

# Recovery, not a second way to finish. `finish` pushes the merge before it
# removes the worktree and the ledger row, so an interrupted closeout leaves
# work merged and pushed with cleanup outstanding; `resume` completes exactly
# that and is safe to run repeatedly. Every command here is deliberately a
# single unchained invocation -- `tests/test_source_checks.py` asserts it,
# because a lifecycle command wrapped in `-Command` or chained onto
# `cd`/`git status` no longer matches .codex/rules/meadow.rules and is denied.
[[actions]]
name = "Resume slice closeout"
icon = "refresh"
command = "powershell -NoProfile -ExecutionPolicy Bypass -File tools/slice.ps1 resume -Lane Codex"
platform = "win32"
